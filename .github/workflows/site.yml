name: Päivitä ja julkaise

# Every other morning: fetch the offers, commit the data and publish the page on GitHub Pages.
# Every push to main (code changes, a new K-Ruoka snapshot): publish the page again.
# Commits made by this workflow do not start it again, so the deploy job runs in the same run.
on:
  schedule:
    # Every other day (1st, 3rd, 5th … of the month) at 05:20 UTC = 07:20 Finnish winter time, 08:20 in summer.
    # The run takes about 15 minutes and GitHub may start it a little late, so the new offers are up by about 8.
    - cron: "20 5 */2 * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # K-Ruoka refuses GitHub's servers. Its offers come from a Windows machine at home (tools/windows/).
      - name: Fetch S-kaupat, Lidl, Kärkkäinen, Tokmanni and Rusta offers
        run: python site/fetch_offers.py
      - name: Check that the page still builds
        run: python site/build.py
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data/offers.json site/data/k-ruoka-snapshot.json
          git commit -m "Refresh offers $(date -u +%F)" || echo "No changes"
          git pull --rebase origin main && git push

  deploy:
    needs: refresh
    if: always() && needs.refresh.result != 'cancelled'   # publish even if a store fetch failed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python site/build.py
      - name: Turn on GitHub Pages if it is still off (otherwise set Settings, Pages, Source to GitHub Actions)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
      - id: pages
        uses: actions/deploy-pages@v4
