name: Android-sovellus

# Builds the APK whenever the app code changes and puts it on a fixed download address:
# https://github.com/aapokat/JKL_Tarjoukset/releases/download/android-latest/jkl-tarjoukset.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        env:
          # Optional: a signing key of your own as repository secrets (see README). Without them the key in the repo is used.
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          if [ -n "$APP_KEYSTORE_B64" ]; then
            echo "$APP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            export APP_KEYSTORE="$RUNNER_TEMP/app.keystore"
          else
            unset APP_KEYSTORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD
          fi
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk jkl-tarjoukset.apk
      - name: Publish on the fixed download address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Jyväskylän tarjoukset Android-sovellus, versio 1.0.${{ github.run_number }} ($(date -u +%d.%m.%Y)). Asenna lataamalla jkl-tarjoukset.apk puhelimella."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest jkl-tarjoukset.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest jkl-tarjoukset.apk --title "Android-sovellus" --notes "$notes" --latest
          fi
