# Netlify: builds the page from the committed data and runs the price alert functions.
# The data itself is refreshed by GitHub Actions (.github/workflows/refresh.yml), which commits it;
# every commit makes Netlify rebuild the site.
[build]
  command = "python3 site/build.py"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# offers.json changes every day; let browsers check for a new one.
[[headers]]
  for = "/offers.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
